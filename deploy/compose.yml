services:
  web:
    image: ghcr.io/nullradix-dev/nullradix:${APP_COMMIT}
    ports:
      - "127.0.0.1:${APP_PORT}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    cpus: 0.5
    mem_limit: 64m
    memswap_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
