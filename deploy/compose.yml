# NULLRADIX auf dem VPS, als App der gemeinsamen Plattform (eigener Benutzer, rootless Docker).
# Ausgerollt per Workflow Deploy: der Server setzt APP_COMMIT (Image-Tag) und APP_PORT (Port der App).
# nginx auf dem Host macht TLS und leitet www.nullradix.de hierher.

services:
  web:
    image: ghcr.io/nullradix-dev/nullradix:${APP_COMMIT}
    ports:
      - "127.0.0.1:${APP_PORT}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    mem_limit: 64m
    restart: unless-stopped
