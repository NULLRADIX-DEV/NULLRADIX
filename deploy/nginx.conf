# Läuft im Container hinter dem nginx des Hosts (TLS, Logs, certbot bleiben dort).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects relativ lassen, sonst zeigen sie auf http://…:80 statt auf die echte Domain
    absolute_redirect off;

    # Unbekannte Pfade: die eigene 404-Seite (mit Status 404)
    error_page 404 /404.html;

    # Saubere URLs für die Multi-Page-Seite: /impressum -> /impressum.html
    # HTML, Film usw. bei jedem Aufruf prüfen (ETag -> 304): sonst behalten Browser nach einem Deploy
    # die alte Seite samt ihren alten Assets
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # Fingerprinted Assets langlebig cachen
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    access_log off;
}
