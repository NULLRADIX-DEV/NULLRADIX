# Läuft im Container hinter dem nginx des Hosts (TLS, Logs, certbot bleiben dort).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects relativ lassen, sonst zeigen sie auf http://…:80 statt auf die echte Domain
    absolute_redirect off;

    # Saubere URLs für die Multi-Page-Seite: /impressum -> /impressum.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Fingerprinted Assets langlebig cachen
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    access_log off;
}
